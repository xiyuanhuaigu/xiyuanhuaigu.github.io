# GitLab CI：构建 Hexo 并发布到 GitLab Pages
# 推送 / 合并到默认分支后自动触发

image: node:24

stages:
  - build
  - deploy

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

build:
  stage: build
  script:
    - npm ci --no-audit --no-fund
    - npx hexo generate
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# GitLab Pages 约定：job 必须叫 `pages`，产物必须在 public/ 目录
pages:
  stage: deploy
  needs:
    - build
  script:
    - echo "Deploying Hexo site to GitLab Pages"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
